<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Reminder</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    transition: background .3s;
  }

  /* ── DARK (default — Notion dark #191919) ── */
  body { background: #191919; }

  .card {
    background: #1f1f1f;
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    padding: 1.4rem 1.8rem;
    width: 100%;
    border-left: 3px solid #C0392B;
    cursor: pointer;
    transition: background .3s, border-color .3s;
    user-select: none;
  }

  .label {
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #555;
    margin-bottom: 10px;
    transition: color .3s;
  }

  .quote-line {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 0.06em;
    color: #FFFFFF;
    min-height: 36px;
    display: flex;
    align-items: center;
    gap: 3px;
    line-height: 1;
    transition: color .3s;
  }

  .cursor {
    display: inline-block;
    width: 3px;
    height: 0.85em;
    background: #C0392B;
    vertical-align: middle;
    animation: blink 0.7s step-end infinite;
    flex-shrink: 0;
    margin-left: 2px;
  }

  /* ── LIGHT ── */
  body.light { background: #ffffff; }
  body.light .card { background: #f7f7f7; border-color: #e0e0e0; }
  body.light .label { color: #aaa; }
  body.light .quote-line { color: #111111; }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0; }
  }
</style>
</head>
<body>
  <div class="card" onclick="toggleTheme()" title="Click para cambiar tema">
    <p class="label">A daily reminder to your future self</p>
    <p class="quote-line">
      <span id="tw"></span>
      <span class="cursor"></span>
    </p>
  </div>

  <script>
    const quotes = [
      "Progreso, no perfección.",
      "Winners Win",
      "Gana la mañana, gana el día.",
      "La disciplina es libertad.",
      "Show up. Every single day.",
      "Las victorias son interés compuesto — acumúlalas.",
      "GTA 6 en una villa en Bali",
    ];

    // Theme toggle — persiste en localStorage
    const saved = localStorage.getItem('reminder-theme');
    if (saved === 'light') document.body.classList.add('light');

    function toggleTheme() {
      document.body.classList.toggle('light');
      localStorage.setItem('reminder-theme', document.body.classList.contains('light') ? 'light' : 'dark');
    }

    // Typewriter — setInterval + Date.now() para que no se rompa en iframes throttleados
    let qi = Math.floor(Math.random() * quotes.length), ci = 0, del = false;
    let waitUntil = 0;
    const el = document.getElementById('tw');

    function nextIndex() {
      let next;
      do { next = Math.floor(Math.random() * quotes.length); } while (next === qi);
      return next;
    }

    setInterval(() => {
      const now = Date.now();
      if (now < waitUntil) return;
      const q = quotes[qi];
      if (!del) {
        el.textContent = q.slice(0, ++ci);
        waitUntil = now + 65;
        if (ci >= q.length) { del = true; waitUntil = now + 2000; }
      } else {
        if (ci <= 0) {
          del = false;
          qi = nextIndex();
          waitUntil = now + 400;
        } else {
          el.textContent = q.slice(0, --ci);
          waitUntil = now + 35;
        }
      }
    }, 20);
  </script>
</body>
</html>
