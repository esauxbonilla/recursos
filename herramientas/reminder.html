<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Reminder</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 1.5rem;
  }

  .card {
    background: #181818;
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    padding: 1.4rem 1.8rem;
    width: 100%;
    max-width: 580px;
    border-left: 3px solid #C0392B;
  }

  .label {
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #555;
    margin-bottom: 10px;
  }

  .quote-line {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 0.06em;
    color: #FFFFFF;
    min-height: 36px;
    display: flex;
    align-items: center;
    gap: 3px;
    line-height: 1;
  }

  .cursor {
    display: inline-block;
    width: 3px;
    height: 0.85em;
    background: #C0392B;
    vertical-align: middle;
    animation: blink 0.7s step-end infinite;
    flex-shrink: 0;
    margin-left: 2px;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0; }
  }
</style>
</head>
<body>
  <div class="card">
    <p class="label">A daily reminder to your future self</p>
    <p class="quote-line">
      <span id="tw"></span>
      <span class="cursor"></span>
    </p>
  </div>

  <script>
    const quotes = [
      "Progress, not perfection.",
      "Winners Win",
      "Win the morning, win the day.",
      "Discipline is freedom.",
      "Show up. Every single day.",
      "Small moves, compounding fast.",
    ];

    let qi = Math.floor(Math.random() * quotes.length), ci = 0, del = false;
    const el = document.getElementById('tw');

    function nextIndex() {
      let next;
      do { next = Math.floor(Math.random() * quotes.length); } while (next === qi);
      return next;
    }

    function tick() {
      const q = quotes[qi];
      if (!del) {
        el.textContent = q.slice(0, ++ci);
        if (ci === q.length) { del = true; setTimeout(tick, 2000); return; }
        setTimeout(tick, 60);
      } else {
        el.textContent = q.slice(0, --ci);
        if (ci === 0) { del = false; qi = nextIndex(); setTimeout(tick, 400); return; }
        setTimeout(tick, 32);
      }
    }

    tick();
  </script>
</body>
</html>
